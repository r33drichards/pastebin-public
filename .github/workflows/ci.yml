name: WordPress checks and immutable artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR code runs only on fresh, secretless hosted runners. This workflow never
# deploys and must not become pull_request_target or receive write access.
permissions:
  contents: read

concurrency:
  group: wordpress-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PBIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Build, unit, real WordPress and browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PBIN_SOURCE_SHA }}
          persist-credentials: false
      - name: Check out fixed real WordPress core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WordPress/WordPress
          ref: fc9832bef919c2a08541248db23af90d14ffb082 # 7.1.3, matches observed Wasmer core
          path: .ci-wordpress-core
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install system PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php8.3-cli php8.3-mysql php8.3-mbstring php8.3-xml
          php --version
          node --version
          python3 --version
      - name: Install locked browser dependencies
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Required syntax and unit checks
        run: bash wordpress/ci/check-unit.sh
      - name: Build reproducible artifact and extract exact bytes for tests
        id: package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PBIN_SOURCE_SHA"
          mkdir -p .ci-artifacts
          python3 wordpress/tools/package.py --source wordpress/pbin --revision "$PBIN_SOURCE_SHA" --output .ci-artifacts/pbin.zip > .ci-artifacts/build.json
          python3 wordpress/tools/package.py --source wordpress/pbin --revision "$PBIN_SOURCE_SHA" --output "$RUNNER_TEMP/pbin-repeat.zip" > "$RUNNER_TEMP/pbin-repeat.json"
          cmp .ci-artifacts/pbin.zip "$RUNNER_TEMP/pbin-repeat.zip"
          digest="$(python3 -c 'import json; print(json.load(open(".ci-artifacts/build.json"))["artifact_sha256"])')"
          python3 wordpress/tools/package.py --verify .ci-artifacts/pbin.zip --sha256 "$digest" --revision "$PBIN_SOURCE_SHA" --extract-to "$RUNNER_TEMP/pbin-tested"
          printf '%s  pbin.zip\n' "$digest" > .ci-artifacts/SHA256SUMS
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Real WordPress, MySQL and Chromium tests against the built package
        env:
          PBIN_WP_CORE_DIR: ${{ github.workspace }}/.ci-wordpress-core
          PBIN_TEST_PLUGIN_DIR: ${{ runner.temp }}/pbin-tested/pbin
          PBIN_TEST_ARTIFACT: ${{ github.workspace }}/.ci-artifacts/pbin.zip
          PBIN_TEST_ARTIFACT_SHA256: ${{ steps.package.outputs.digest }}
          PBIN_TEST_DB_USER: root
          PBIN_TEST_DB_PASSWORD: disposable-ci-only
          PBIN_TEST_RESULTS_DIR: ${{ github.workspace }}/.ci-results/wordpress
        run: bash wordpress/ci/run-fixture.sh bash wordpress/ci/run-contracts.sh
      - name: Canonical /paste routing on a real WordPress site
        env:
          PBIN_WP_CORE_DIR: ${{ github.workspace }}/.ci-wordpress-core
          PBIN_TEST_PLUGIN_DIR: ${{ runner.temp }}/pbin-tested/pbin
          PBIN_TEST_DB_USER: root
          PBIN_TEST_DB_PASSWORD: disposable-ci-only
          PBIN_TEST_BASE_PATH: /paste
          PBIN_TEST_EDITOR_AT_BASE: '1'
          PBIN_TEST_RESULTS_DIR: ${{ github.workspace }}/.ci-results/wordpress-canonical
        run: bash wordpress/ci/run-fixture.sh node --test wordpress/ci/canonical-http-contract.test.mjs
      - name: Verify artifact did not change while tested
        run: cd .ci-artifacts && sha256sum --check SHA256SUMS
      - name: Transfer tested artifact to gated artifact job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-package-${{ env.PBIN_SOURCE_SHA }}
          # Only this generated package directory; never include the checkout.
          include-hidden-files: true
          path: .ci-artifacts/
          if-no-files-found: error
          retention-days: 2
      - name: Preserve failure and browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordpress-test-report-${{ env.PBIN_SOURCE_SHA }}
          # The fixture copies only named logs, never wp-config.php or DB dumps.
          include-hidden-files: true
          path: |
            .ci-results/
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  artifact:
    name: Retain tested immutable package (not deployment)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download this run's tested bytes only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-package-${{ env.PBIN_SOURCE_SHA }}
          path: package
      - name: Verify transported archive and exact revision
        run: |
          cd package
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          data = pathlib.Path('pbin.zip').read_bytes()
          report = json.loads(pathlib.Path('build.json').read_text())
          assert hashlib.sha256(data).hexdigest() == report['artifact_sha256']
          assert report['revision'] == os.environ['PBIN_SOURCE_SHA']
          with zipfile.ZipFile('pbin.zip') as archive:
              manifest = json.loads(archive.read('manifest.json'))
          assert manifest['revision'] == os.environ['PBIN_SOURCE_SHA']
          PY
      - name: Retain the exact tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pbin-wordpress-${{ env.PBIN_SOURCE_SHA }}
          path: package/
          if-no-files-found: error
          retention-days: 14
# No deploy job: a trusted control plane and verified Wasmer install/execute
# mechanism are still required. Artifact availability is not deploy permission.
